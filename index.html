<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Imágenes IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; }
        .header-api { background: #007bff; color: white; border-radius: 15px 15px 0 0; padding: 20px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg">
                <div class="header-api text-center">
                    <h3>📸 Clasificador IA + AWS</h3>
                    <p class="mb-0">Proyecto Final - Integración Cloud</p>
                </div>
                <div class="card-body p-4">
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Selecciona una imagen (JPG/PNG)</label>
                        <input type="file" id="fileInput" class="form-control" accept="image/*">
                    </div>

                    <button id="uploadBtn" class="btn btn-primary w-100 btn-lg shadow-sm">
                        🚀 Analizar y Guardar en Django
                    </button>

                    <div id="loader" class="text-center mt-4" style="display: none;">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Procesando en AWS Lambda...</p>
                    </div>

                    <div id="responseArea" class="mt-4" style="display: none;">
                        <div id="alertBox" class="alert"></div>
                        <div class="border rounded p-3 bg-white">
                            <p><strong>Tipo:</strong> <span id="tipoResult"></span></p>
                            <p><strong>Etiquetas:</strong> <span id="tagsResult"></span></p>
                            <p class="mb-0"><strong>Status Django:</strong> <span id="djangoResult"></span></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://xtaqpgk6u1.execute-api.us-east-1.amazonaws.com/clasificador-imagenes-examen";

    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');
        const responseArea = document.getElementById('responseArea');
        const alertBox = document.getElementById('alertBox');

        if (!fileInput.files[0]) {
            alert("Por favor selecciona un archivo primero");
            return;
        }

        const file = fileInput.files[0];
        
        // UI Reset
        loader.style.display = 'block';
        responseArea.style.display = 'none';
        document.getElementById('uploadBtn').disabled = true;

        try {
            // Convertir a Base64
            const base64 = await toBase64(file);
            const cleanBase64 = base64.split(',')[1];

            const payload = {
                nombre: file.name,
                imagen_base64: cleanBase64
            };

            // PETICIÓN FETCH
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors', // Forzamos modo CORS
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            // Mostrar Resultados
            loader.style.display = 'none';
            responseArea.style.display = 'block';
            document.getElementById('uploadBtn').disabled = false;

            if (data.error) {
                alertBox.className = "alert alert-danger";
                alertBox.innerText = "Error de AWS: " + data.error;
            } else {
                alertBox.className = "alert alert-success";
                alertBox.innerText = "¡Procesado exitosamente!";
                
                document.getElementById('tipoResult').innerText = data.tipo;
                document.getElementById('tagsResult').innerText = data.etiquetas.join(', ');
                document.getElementById('djangoResult').innerText = data.status_django + " (Created)";
            }

        } catch (error) {
            loader.style.display = 'none';
            responseArea.style.display = 'block';
            alertBox.className = "alert alert-danger";
            alertBox.innerText = "Error de conexión: " + error.message;
            document.getElementById('uploadBtn').disabled = false;
            console.error(error);
        }
    });

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>

</body>
</html>
